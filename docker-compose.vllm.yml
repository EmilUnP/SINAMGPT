services:
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.32.0}
    restart: unless-stopped
    gpus: all
    ipc: host
    ports:
      - "${VLLM_BIND_HOST:-127.0.0.1}:${VLLM_PORT:-8000}:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      VLLM_API_KEY: ${VLLM_API_KEY:?Set a private VLLM_API_KEY in .env.vllm}
    volumes:
      - huggingface-cache:/root/.cache/huggingface
      - vllm-cache:/root/.cache/vllm
    command:
      - --model
      - ${VLLM_MODEL:-Qwen/Qwen3-8B}
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN:-8192}
      - --max-num-seqs
      - ${VLLM_MAX_NUM_SEQS:-32}
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEMORY_UTILIZATION:-0.9}
      - --tensor-parallel-size
      - ${VLLM_TENSOR_PARALLEL_SIZE:-1}
      - --enable-prefix-caching
      - --generation-config
      - vllm
      - --enable-auto-tool-choice
      - --tool-call-parser
      - ${VLLM_TOOL_CALL_PARSER:-hermes}
      - --reasoning-parser
      - ${VLLM_REASONING_PARSER:-qwen3}
      - --default-chat-template-kwargs
      - '{"enable_thinking": false}'
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

volumes:
  huggingface-cache:
  vllm-cache:
