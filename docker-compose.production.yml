# One app process and one model engine. See docs/SERVER-DEPLOYMENT.md.
name: sinamgpt
services:
  vllm:
    extends:
      file: docker-compose.vllm.yml
      service: vllm

  # Optional private metasearch for internet search. Opt in with
  # `--profile search` and SEARXNG_SECRET; then Admin -> Settings -> Engine: SearXNG.
  # Inline rather than `extends`, so installs without the secret still parse.
  searxng:
    profiles: ["search"]
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-latest}
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-cache:/var/cache/searxng
    expose:
      - "8080"

  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env.production}
      PROVIDER_KEY_SECRET: ${PROVIDER_KEY_SECRET:?Set PROVIDER_KEY_SECRET in .env.production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env.production}
      APP_URL: https://${SITE_ADDRESS:?Set SITE_ADDRESS to your domain}
      TRUST_PROXY: "1"
      VLLM_BASE_URL: http://vllm:8000
      VLLM_API_KEY: ${VLLM_API_KEY:?Set VLLM_API_KEY in .env.production}
      VLLM_TOOL_CALLING: "1"
      VLLM_MAX_CONCURRENT: ${VLLM_MAX_CONCURRENT:-8}
      LLM_MAX_QUEUE: ${LLM_MAX_QUEUE:-64}
      LLM_QUEUE_TIMEOUT_MS: ${LLM_QUEUE_TIMEOUT_MS:-30000}
      LLM_REQUEST_TIMEOUT_MS: ${LLM_REQUEST_TIMEOUT_MS:-180000}
      # Pre-fills the SearXNG URL in Admin; DuckDuckGo stays the engine until you switch.
      SEARXNG_BASE_URL: http://searxng:8080
    volumes:
      - app-data:/app/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS to your domain}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  searxng-cache:
  app-data:
  huggingface-cache:
  vllm-cache:
  caddy-data:
  caddy-config:
